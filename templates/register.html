<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUGON AI — Admin Registration</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Self-contained Auth Page Styles (centered) -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .auth-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 1rem;
    }

    .auth-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 560px;
      overflow: hidden;
      margin: auto;
    }

    .auth-header {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: #ffffff;
      padding: 2rem;
      text-align: center;
    }

    .auth-header .brand-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 0.5rem;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }

    .auth-header h1 { font-size: 1.4rem; font-weight: 800; margin: 0; }
    .auth-header p { font-size: 0.85rem; opacity: 0.9; margin-top: 0.3rem; }

    .auth-body { padding: 2rem; }

    .auth-footer {
      text-align: center;
      padding: 1.25rem 2rem 2rem;
      border-top: 1px solid #e2e8f0;
      font-size: 0.9rem;
      color: #64748b;
    }

    .auth-switch-link {
      color: #2563eb;
      font-weight: 600;
      text-decoration: none;
    }
    .auth-switch-link:hover { text-decoration: underline; }

    .auth-error-msg {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      border-radius: 8px;
      padding: 0.6rem 0.85rem;
      font-size: 0.85rem;
    }

    .form-group { margin-bottom: 1.5rem; }

    .form-row-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
    }
    @media (max-width: 768px) {
      .form-row-2col { grid-template-columns: 1fr; }
    }

    .form-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.5rem;
    }
    .form-label-required::after { content: " *"; color: #ef4444; }

    .form-control {
      width: 100%;
      padding: 0.8rem 1rem;
      font-size: 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
      background: #ffffff;
    }
    .form-control:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.8rem 1.4rem;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 150ms ease;
      text-decoration: none;
    }
    .btn-primary { background: #2563eb; color: #ffffff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-block { width: 100%; }
    .btn-sm { padding: 0.35rem 0.7rem; font-size: 0.8rem; }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Header -->
      <div class="auth-header">
        <div class="brand-icon"><i class="fa-solid fa-user-plus"></i></div>
        <h1>Administrator Registration</h1>
        <p>Create a new municipal administrator account</p>
      </div>

      <!-- Body -->
      <div class="auth-body">

        <form id="adminRegisterForm" autocomplete="off">

          <div class="form-group">
            <label class="form-label form-label-required" for="regUsername">Username</label>
            <input type="text" id="regUsername" name="username" class="form-control"
                   placeholder="e.g. pardo_admin" required autocomplete="off">
          </div>

          <div class="form-row-2col">
            <div class="form-group">
              <label class="form-label form-label-required" for="regPassword">Password</label>
              <input type="password" id="regPassword" name="password" class="form-control"
                     placeholder="Minimum 6 characters" required autocomplete="off">
            </div>
            <div class="form-group">
              <label class="form-label form-label-required" for="regConfirmPassword">Confirm</label>
              <input type="password" id="regConfirmPassword" name="confirm_password" class="form-control"
                     placeholder="Re-type password" required autocomplete="off">
            </div>
          </div>

          <div class="form-row-2col">
            <div class="form-group">
              <label class="form-label form-label-required" for="regFullName">Full Name</label>
              <input type="text" id="regFullName" name="full_name" class="form-control"
                     placeholder="Maria Santos" required autocomplete="off">
            </div>
            <div class="form-group">
              <label class="form-label form-label-required" for="regRole">Role</label>
              <select id="regRole" name="role" class="form-control" required>
                <option value="ADMIN">Admin (Sector Scope)</option>
                <option value="SUPERADMIN">Superadmin (Full Access)</option>
              </select>
            </div>
          </div>

          <div class="form-row-2col">
            <div class="form-group">
              <label class="form-label form-label-required" for="regEmail">Official Email</label>
              <input type="email" id="regEmail" name="email" class="form-control"
                     placeholder="user@cebucity.gov.ph" required autocomplete="off">
            </div>
            <div class="form-group">
              <label class="form-label" for="regOffice">Assigned Office</label>
              <select id="regOffice" name="assigned_office" class="form-control">
                <option value="">None (Global Access)</option>
                <option value="CCDRRMO">CCDRRMO</option>
                <option value="BFP">BFP — Fire Protection</option>
                <option value="CCTO">CCTO — Transportation</option>
                <option value="DSWD">DSWD — Social Welfare</option>
                <option value="NUTRITION">NUTRITION — Nutrition Office</option>
                <option value="CHD">CHD — City Health Department</option>
                <option value="CCMC">CCMC — Medical Center</option>
                <option value="DEPW">DEPW — Engineering &amp; Public Works</option>
                <option value="DPS">DPS — Public Services</option>
                <option value="CAD">CAD — City Agriculture</option>
                <option value="DVMF">DVMF — Veterinary &amp; Fisheries</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="btnAdminRegister" style="margin-top:0.5rem;">
            <i class="fa-solid fa-user-plus"></i> Create Account
          </button>
        </form>

        <div id="adminRegisterStatus" style="display:none; margin-top:0.75rem;"></div>
      </div>

      <!-- Footer -->
      <div class="auth-footer">
        Already have an account?
        <a href="/login" class="auth-switch-link">Sign in here</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('adminRegisterForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnAdminRegister');
      const status = document.getElementById('adminRegisterStatus');
      status.style.display = 'block';
      status.innerHTML = '';
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating Account...';

      const pwd = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirmPassword').value;

      if (pwd !== confirm) {
        status.innerHTML = '<div class="auth-error-msg"><i class="fa-solid fa-circle-exclamation"></i> Passwords do not match.</div>';
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
        return;
      }
      if (pwd.length < 6) {
        status.innerHTML = '<div class="auth-error-msg"><i class="fa-solid fa-circle-exclamation"></i> Password must be at least 6 characters.</div>';
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
        return;
      }

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          body: new FormData(e.target)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Registration failed');

        status.innerHTML = '<div class="auth-error-msg" style="background:#d1fae5; border-color:#6ee7b7; color:#065f46;"><i class="fa-solid fa-circle-check"></i> Account created! Redirecting...</div>';
        setTimeout(() => window.location.href = '/login', 1500);
      } catch (err) {
        status.innerHTML = '<div class="auth-error-msg"><i class="fa-solid fa-circle-exclamation"></i> ' + err.message + '</div>';
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
      }
    });
  </script>
</body>
</html>
