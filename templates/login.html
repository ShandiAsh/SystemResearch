<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUGON AI — Admin Login</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Self-contained Auth Page Styles (centered) -->
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .auth-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 1rem;
    }

    .auth-card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
      overflow: hidden;
      margin: auto;
    }

    .auth-header {
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      color: #ffffff;
      padding: 2rem;
      text-align: center;
    }

    .auth-header .brand-icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 0.5rem;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
    }

    .auth-header h1 { font-size: 1.4rem; font-weight: 800; margin: 0; }
    .auth-header p { font-size: 0.85rem; opacity: 0.9; margin-top: 0.3rem; }

    .auth-body { padding: 2rem; }

    .auth-footer {
      text-align: center;
      padding: 1.25rem 2rem 2rem;
      border-top: 1px solid #e2e8f0;
      font-size: 0.9rem;
      color: #64748b;
    }

    .auth-switch-link {
      color: #2563eb;
      font-weight: 600;
      text-decoration: none;
    }
    .auth-switch-link:hover { text-decoration: underline; }

    .auth-cred-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      color: #1e40af;
      margin-bottom: 1.25rem;
    }
    .auth-cred-box code {
      background: #dbeafe;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .auth-error-msg {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      border-radius: 8px;
      padding: 0.6rem 0.85rem;
      font-size: 0.85rem;
    }

    .form-group { margin-bottom: 1.5rem; }
    .form-label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.5rem;
    }
    .form-control {
      width: 100%;
      padding: 0.8rem 1rem;
      font-size: 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      outline: none;
    }
    .form-control:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.8rem 1.4rem;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 150ms ease;
      text-decoration: none;
    }
    .btn-primary { background: #2563eb; color: #ffffff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-block { width: 100%; }
  </style>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">

      <!-- Header -->
      <div class="auth-header">
        <div class="brand-icon"><i class="fa-solid fa-user-shield"></i></div>
        <h1>Administrator Access</h1>
        <p>TUGON AI Command Center — Municipal Portal</p>
      </div>

      <!-- Body -->
      <div class="auth-body">

        <form id="adminLoginForm" autocomplete="off">
          <div class="form-group">
            <label class="form-label" for="adminUsername">Username / Admin ID</label>
            <input type="text" id="adminUsername" name="username" class="form-control"
                   placeholder="Enter your admin username" required autocomplete="off">
          </div>

          <div class="form-group">
            <label class="form-label" for="adminPassword">Password</label>
            <input type="password" id="adminPassword" name="password" class="form-control"
                   placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;"
                   required autocomplete="off">
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="btnAdminLogin">
            <i class="fa-solid fa-right-to-bracket"></i> Sign In
          </button>
        </form>

        <div id="adminLoginStatus" style="display:none; margin-top:0.75rem;"></div>
      </div>

      <!-- Footer -->
      <div class="auth-footer">
        New to the command center?
        <a href="/register" class="auth-switch-link">Create an administrator account</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('adminLoginForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnAdminLogin');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';

      const status = document.getElementById('adminLoginStatus');
      status.style.display = 'block';
      status.innerHTML = '';
      status.style.color = '#38bdf8';
      status.textContent = 'Verifying credentials...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          body: new FormData(e.target)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Login failed');

        localStorage.setItem('tugon_admin_user', JSON.stringify(data.user));
        status.style.color = '#10b981';
        status.textContent = 'Login successful — redirecting...';
        window.location.href = '/dashboard';
      } catch (err) {
        status.innerHTML = '<div class="auth-error-msg"><i class="fa-solid fa-circle-exclamation"></i> ' + err.message + '</div>';
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In';
      }
    });
  </script>
</body>
</html>
