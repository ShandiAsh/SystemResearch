<!-- Font Awesome -->

<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {

              DEFAULT: '#0284c7',
              dark: '#0369a1',

<!-- BEGIN: Custom Glassmorphism and Graphic Styles -->
<style data-purpose="glass-effects">
    /* High fidelity frosted glass surface */
    .glass-card {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.65) 0%, rgba(255, 255, 255, 0.32) 100%);
      backdrop-filter: blur(28px) saturate(160%);
      -webkit-backdrop-filter: blur(28px) saturate(160%);
      border: 1.5px solid rgba(255, 255, 255, 0.75);
    }

    /* Ambient glossy button gradient mimicking reference */
    .btn-glossy-primary {
      background: linear-gradient(180deg, #1ea2fa 0%, #0377dc 52%, #0260c0 100%);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    .btn-glossy-primary:active {
      transform: scale(0.985);
      background: linear-gradient(180deg, #1b8fdc 0%, #0269c4 100%);
    }

    /* Blue dimensional text gradient for TUGON AI */
    .brand-gradient-text {
      background: linear-gradient(180deg, #028df0 0%, #025bbd 65%, #00459c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0px 1px 1.5px rgba(2, 60, 130, 0.3));
    }
  </style>
  <style data-purpose="network-particles">
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .node-glow {
      animation: pulseGlow 3.5s infinite ease-in-out;
    }
  </style>
  <style data-purpose="background-image">
    .bg-scenic {
      background-image: url('https://images.unsplash.com/photo-1508606572321-901ea5d63f65?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }
  </style>
</head>
<body class="bg-slate-200 antialiased font-sans m-0 p-0 flex items-center justify-center min-h-screen select-none overflow-hidden">
<!-- BEGIN: MobileDeviceContainer -->

<!-- BEGIN: BackgroundLayer -->

</div>
